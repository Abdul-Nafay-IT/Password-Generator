<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PassGen - Generate cryptographically secure random passwords instantly." />
  <title>PassGen — Generate a Random Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Ambient Background Glows -->
  <div class="bg-glow bg-glow--purple" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--green" aria-hidden="true"></div>

  <!-- Navigation Header -->
  <header class="site-header">
    <nav class="navbar" aria-label="Primary Navigation">
      <a href="#" class="brand">
        <svg class="brand__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>PassGen</span>
      </a>

      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navMenu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="nav-menu" id="navMenu">
        <ul class="nav-links">
          <li><a href="#features" data-modal-trigger="featuresModal">Features</a></li>
          <li><a href="#extension" data-modal-trigger="extensionModal">Extension</a></li>
          <li><a href="#security" data-modal-trigger="securityModal">Security</a></li>
          <li><a href="#about" data-modal-trigger="aboutModal">About</a></li>
        </ul>
        <button type="button" class="btn-login" id="loginBtn">Log In</button>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="main-container">
    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title" class="hero__title">
        Generate a <br />
        <span class="text-accent">random password.</span>
      </h1>
      <p class="hero__subtitle">Never use an insecure password again.</p>
    </section>

    <!-- Password Generator Card -->
    <section class="generator-card" aria-label="Password Generator Controls">
      <!-- Top Row: Display + Copy & Refresh -->
      <div class="output-row">
        <div class="password-field-wrapper">
          <input
            type="text"
            id="passwordOutput"
            class="password-output"
            readonly
            aria-label="Generated Password"
            value=">nfJjy!dDvR&iaI"
          />
        </div>

        <div class="action-buttons">
          <button type="button" class="icon-btn" id="copyBtn" aria-label="Copy password to clipboard">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="copyLabel">Copy</span>
          </button>

          <button type="button" class="icon-btn" id="refreshBtn" aria-label="Generate a new password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span>Refresh</span>
          </button>
        </div>
      </div>

      <!-- Strength Meter -->
      <div class="strength-section">
        <div class="strength-header">
          <span class="strength-label">Password Strength</span>
          <span class="strength-status" id="strengthText" aria-live="polite">Strong!</span>
        </div>
        <div class="strength-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" id="strengthBarContainer">
          <div class="strength-fill" id="strengthFill"></div>
        </div>
      </div>

      <!-- Bottom Row: Generate CTA + Length & Character Checkboxes -->
      <div class="controls-row">
        <button type="button" class="btn-generate" id="generateBtn">
          Generate Password
        </button>

        <div class="settings-panel">
          <!-- Length Slider -->
          <div class="length-control">
            <label for="lengthSlider" class="length-label">Length</label>
            <input
              type="range"
              id="lengthSlider"
              class="range-slider"
              min="6"
              max="64"
              value="16"
            />
            <span class="length-value" id="lengthValue">16</span>
          </div>

          <!-- Character Type Checkboxes -->
          <div class="checkbox-grid">
            <label class="custom-checkbox">
              <input type="checkbox" id="includeUppercase" checked />
              <span class="checkmark"></span>
              <span>Uppercase</span>
            </label>

            <label class="custom-checkbox">
              <input type="checkbox" id="includeLowercase" checked />
              <span class="checkmark"></span>
              <span>Lowercase</span>
            </label>

            <label class="custom-checkbox">
              <input type="checkbox" id="includeNumbers" checked />
              <span class="checkmark"></span>
              <span>Numbers</span>
            </label>

            <label class="custom-checkbox">
              <input type="checkbox" id="includeSymbols" checked />
              <span class="checkmark"></span>
              <span>Symbols</span>
            </label>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Toast Notification -->
  <div class="toast" id="toast" role="status" aria-live="polite">Password copied to clipboard!</div>

  <!-- Interactive Modals for Nav Items -->
  <dialog class="modal" id="infoModal">
    <div class="modal__content">
      <div class="modal__header">
        <h2 id="modalTitle">Information</h2>
        <button type="button" class="modal__close" id="closeModalBtn" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
